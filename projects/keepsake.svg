<svg xmlns="http://www.w3.org/2000/svg" width="340" height="132" viewBox="0 0 340 132" role="img" aria-label="Keepsake: Your emulator saves, in one place.">
  <title>Keepsake</title>
  <defs>
    <clipPath id="icon"><rect x="22" y="30" width="72" height="72" rx="16.2"/></clipPath>
    <radialGradient id="glow" cx="340" cy="0" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcc00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="339" height="131" rx="16" fill="#161b22" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="339" height="131" rx="16" fill="url(#glow)"/>
  <image href="data:image/png;base64," x="22" y="30" width="72" height="72" clip-path="url(#icon)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="22" y="30" width="72" height="72" rx="16.2" fill="none" stroke="#f0f6fc" stroke-opacity="0.1"/>
  <circle cx="316" cy="26" r="4.5" fill="#3fb950"/>
  <text x="112" y="48" font-size="20" font-weight="600" fill="#f0f6fc" letter-spacing="-0.3">Keepsake</text>
  <text x="112" y="70" font-size="13.5" fill="#9198a1">Your emulator saves, in one</text>
  <text x="112" y="88" font-size="13.5" fill="#9198a1">place.</text>
  <text x="112" y="112" font-size="11" fill="#6e7681" class="mono">Windows</text>
</svg>
